[package]
name = "duperr"
version = "0.1.0"
edition = "2021"
authors = ["Duperr Authors"]
description = "A fast and safe duplicate file finder"
license = "MIT"
keywords = ["duplicate", "files", "dedup", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
# CLI parsing
clap = { version = "4.4", features = ["derive", "env", "unicode", "wrap_help"] }

# Directory traversal
walkdir = "2.4"

# Parallel processing
rayon = "1.8"

# Fast hashing (BLAKE3)
blake3 = "1.5"

# Progress indicators
indicatif = { version = "0.17", features = ["rayon"] }

# Interactive prompts
dialoguer = "0.11"

# JSON/CSV serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Terminal colors
colored = "2.1"

# TTY detection
atty = "0.2"

# Memory mapping for large files
memmap2 = "0.9"

# Glob pattern matching
globset = "0.4"

# Human-readable sizes
humansize = "2.1"

# Hash encoding
hex = "0.4"

# Time formatting
chrono = "0.4"

# Logging
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "duperr"
path = "src/main.rs"
